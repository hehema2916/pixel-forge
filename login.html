<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 — 像素工坊（结构演示站）</title>
<meta name="description" content="结构演示站：信息架构参考公开案例的学习笔记，代码与文案均为原创。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23b03a2a'/%3E%3Crect x='10' y='10' width='12' height='12' fill='%23f6f2ea'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container nav">
    <a class="nav-logo" href="index.html"><span class="logo-mark"></span>像素工坊</a>
    <div class="nav-actions">
      <a class="btn btn-ghost" href="index.html">返回首页</a>
    </div>
  </div>
</header>

<main>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="brand"><span class="logo-mark"></span>登录像素工坊</div>
      <p class="sub">演示环境：验证码与登录会调用本地真实接口（/api/auth/*），不会真的发送短信。</p>

      <div class="auth-tabs" id="authTabs">
        <button class="active" data-panel="phone">手机验证码</button>
        <button data-panel="qrcode">微信扫码</button>
        <button data-panel="sso">企业 SSO</button>
      </div>

      <!-- 面板 1：手机验证码 -->
      <div class="auth-panel" data-panel="phone">
        <div class="field">
          <label for="phone">手机号</label>
          <input id="phone" type="tel" placeholder="请输入手机号" autocomplete="tel">
        </div>
        <div class="field">
          <label for="code">验证码</label>
          <div class="input-row">
            <input id="code" type="text" placeholder="6 位数字验证码" autocomplete="one-time-code">
            <button class="btn btn-outline code-btn" data-code-btn>获取验证码</button>
          </div>
        </div>
        <label class="agree">
          <input type="checkbox" checked>
          <span>我已阅读并同意《用户协议》与《隐私政策》（演示链接）</span>
        </label>
        <button class="btn btn-primary btn-block btn-lg" id="btnLogin">登录 / 注册</button>
      </div>

      <!-- 面板 2：微信扫码 -->
      <div class="auth-panel" data-panel="qrcode" hidden>
        <div style="text-align:center; padding: 6px 0 4px;">
          <div style="width:180px;height:180px;margin:0 auto 14px;border:1px solid var(--ink);background:
            linear-gradient(45deg, #ece5d8 25%, transparent 25%, transparent 75%, #ece5d8 75%) 0 0/24px 24px,
            linear-gradient(45deg, #ece5d8 25%, #fff 25%, #fff 75%, #ece5d8 75%) 12px 12px/24px 24px;
            display:flex;align-items:center;justify-content:center;">
            <span style="background:#fff;border:1px solid var(--ink);padding:8px 12px;font-size:13px;font-weight:700;color:var(--ink-2);">微信扫码（演示）</span>
          </div>
          <p class="muted small">请使用微信扫一扫登录，二维码每 60 秒自动刷新（演示）。</p>
        </div>
      </div>

      <!-- 面板 3：企业 SSO -->
      <div class="auth-panel" data-panel="sso" hidden>
        <div class="field">
          <label for="corp">企业域名</label>
          <input id="corp" type="text" placeholder="例如：your-company.com">
        </div>
        <button class="btn btn-primary btn-block btn-lg" data-demo="演示站：SSO 跳转未接入">跳转到企业登录</button>
        <p class="muted small" style="margin-top:14px;">支持 SAML / OIDC / 飞书 / 企业微信 / 钉钉组织架构同步（演示）。</p>
      </div>

      <p class="auth-foot">还没有账号？<a href="#" data-demo="演示站：注册流程未接入">立即注册</a><span class="sep"> · </span><a href="#" data-demo="演示站：帮助中心未接入">遇到问题？</a></p>
    </div>
  </div>
</main>

<footer class="site-footer" style="padding: 28px 0;">
  <div class="container">
    <div class="footer-bottom" style="border-top:0; padding-top:0;">
      <span>© <span data-year>2026</span> 像素工坊（结构演示） · 仅用于学习演示</span>
      <span><a href="index.html">返回首页</a><span class="sep">·</span><a href="pricing.html">定价</a><span class="sep">·</span><a href="compare.html">产品对比</a></span>
    </div>
  </div>
</footer>

<script src="assets/js/main.js"></script>
<script>
/* 登录页专属 1：三种登录方式的切换 */
(function () {
  var tabs = document.querySelectorAll('#authTabs button');
  var panels = document.querySelectorAll('.auth-panel');
  tabs.forEach(function (tab) {
    tab.addEventListener('click', function () {
      tabs.forEach(function (t) { t.classList.remove('active'); });
      tab.classList.add('active');
      var key = tab.getAttribute('data-panel');
      panels.forEach(function (p) {
        p.hidden = p.getAttribute('data-panel') !== key;
      });
    });
  });
})();

/* 登录页专属 2：登录提交 —— 优先调用真实接口 /api/auth/login */
(function () {
  var btn = document.getElementById('btnLogin');
  if (!btn) return;
  btn.addEventListener('click', function () {
    var phoneEl = document.getElementById('phone');
    var codeEl = document.getElementById('code');
    var phone = phoneEl ? phoneEl.value.trim() : '';
    var code = codeEl ? codeEl.value.trim() : '';
    if (!/^1\d{10}$/.test(phone)) { window.pfToast('请输入 11 位手机号（演示）'); return; }
    if (!code) { window.pfToast('请输入验证码：先点「获取验证码」，提示里会带码（演示）'); return; }

    fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone: phone, code: code })
    })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j && j.code === 0 && j.data) {
          try { localStorage.setItem('pf_token', j.data.token); } catch (e) {}
          window.pfToast('登录成功：' + j.data.user.name + '（真实接口演示）');
        } else {
          window.pfToast((j && j.msg) || '登录失败（演示）');
        }
      })
      .catch(function () {
        window.pfToast('后端未启动：演示环境，假装登录成功啦 ✨');
      });
  });
})();
</script>
</body>
</html>
